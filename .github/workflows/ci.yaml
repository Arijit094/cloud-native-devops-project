# CI for Product Catalog Service

name: product-catalog-ci

on: 
    pull_request:
        branches:
        - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v5
          with:
            go-version: "1.22"
        
        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service main.go      #compiled executable binary file product-catalog-service

        - name: unit tests
          run: |
            cd src/product-catalog
            go test ./...

        - name: Upload Binary Artifact
          uses: actions/upload-artifact@v4
          with:
            name: product-catalog-binary
            path: src/product-catalog/product-catalog-service
            retention-days: 1
    
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: Setup Go 1.22
          uses: actions/setup-go@v5
          with:
           go-version: "1.22"
      
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: v1.58.0
            # run: golangci-lint run
            working-directory: src/product-catalog

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Download Binary Artifact
          uses: actions/download-artifact@v4
          with:
            name: product-catalog-binary
            path: src/product-catalog/


        - name: Install Docker
          uses: docker/setup-buildx-action@v3
        
        - name: Login to Docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker Push
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}

    
    updatek8s:
          runs-on: ubuntu-latest
          needs: [docker]

    # Required so GITHUB_TOKEN can push changes back to the repo
          permissions:
           contents: write

          steps:
          - name: Checkout code
            uses: actions/checkout@v4
            with:
              # Check out the actual source branch of the PR (e.g., githubcicheck) instead of a detached HEAD
              ref: ${{ github.head_ref }}
              # Use default GitHub token for authentication
              token: ${{ secrets.GITHUB_TOKEN }}
              # Fetch all history for the repo
              fetch-depth: 0

          - name: Update tag in kubernetes deployment manifest
            run: |
              sed -i 's|image: arijit094/product-catalog:.*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|g' kubernetes/productcatalog/deploy.yaml
              # Displays the exact git changes in the workflow log so you can visually verify the replacement
              git diff kubernetes/productcatalog/deploy.yaml
          - name: Commit and push changes
            run: |
              git config --global user.name "@rijit"
              git config --global user.email "arijitmanna55@gmail.com"
              git add kubernetes/productcatalog/deploy.yaml
        
              git diff --staged --quiet || git commit -m "ci: update product-catalog image tag to ${{ github.run_id }} [skip ci]"
          
              # Pull latest remote changes to avoid rejected pushes
              git fetch origin ${{ github.head_ref }}
              git rebase origin/${{ github.head_ref }}
          
              git push origin HEAD:${{ github.head_ref }}
        
        
          


        